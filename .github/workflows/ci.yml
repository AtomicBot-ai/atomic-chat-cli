name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `release.yml` runs these same gates before it publishes anything.
  workflow_call:
    inputs:
      release:
        description: 'Called by the release: gates only'
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/gen-command-docs.mjs --check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm run test:ui
      - run: npm run build:ui
      - uses: actions/upload-artifact@v4
        with:
          name: admin-ui
          path: packages/admin-ui/dist/

  test:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # The arm64 Linux and Windows binaries are released too, so they are proven on native arm
        # runners, not only cross-compiled.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm test
      - run: npm run test:runtime-compat
      - run: bun test test/runtime-compat
      - run: npm run build
      - run: npm run build:bin
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: atc-${{ matrix.os }}
          path: dist/bin/
