name: release

# Publishes the `atc` binaries. To release: `npm run release -- patch --push` (scripts/release.mjs
# bumps, commits, tags and pushes). The pushed `v*` tag runs this workflow after the CI gates.
# A published version is never replaced: the updater and the installer pin checksums.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the version and refuse one already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  gates:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [version, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:ui
      - run: npm run build:bin:all
        env:
          ATC_GIT_SHA: ${{ github.sha }}

      - name: Check the binary reports the version
        run: |
          got="$(dist/bin/atc-x86_64-unknown-linux-gnu --version)"
          test "$got" = "$VERSION" || { echo "::error::atc reports '$got', expected $VERSION"; exit 1; }

      - name: Name the assets and checksum them
        run: |
          mkdir -p release
          for path in dist/bin/atc-*; do
            name="$(basename "$path")"
            cp "$path" "release/atc-$VERSION-${name#atc-}"
          done
          cp scripts/install.sh scripts/install.ps1 release/
          cd release
          sha256sum atc-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: atc-binaries
          path: release/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then verify="--verify-tag"; fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest \
            $verify
